<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Juego de Lengua de Señas — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Lengua de Señas</h1>
      <p class="sub">Aprende jugando — inicia sesión o regístrate</p>
    </header>

    <!-- LOGIN -->
    <section id="login-form" class="form-box">
      <h2>Iniciar sesión</h2>
      <input type="text" id="login-username" placeholder="Nombre de usuario">
      <input type="password" id="login-password" placeholder="Contraseña">
      <button id="btn-login">Entrar</button>
      <p class="muted">¿No tienes cuenta? <a href="#" id="link-show-register">Regístrate aquí</a></p>
    </section>

    <!-- REGISTRO -->
    <section id="register-form" class="form-box hidden">
      <h2>Registro</h2>
      <input type="text" id="register-username" placeholder="Nombre de usuario">
      <input type="password" id="register-password" placeholder="Contraseña">
      <button id="btn-register">Registrar</button>
      <p class="muted">¿Ya tienes cuenta? <a href="#" id="link-show-login">Inicia sesión</a></p>
    </section>

    <footer class="small">
      <p>Proyecto para GitHub / Vercel • Compatible con LocalStorage</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
